# 서울생존식단 v12 편집표 (v11 + 실제 루틴 반영: 바나나는 오후 3시 회의실 간식으로, 퇴근 전 = 운동 전 충전, 운동 후 = 영양 보충)
# 단백질 목표: 체중 72kg × 2 = 144g (pipeline/render.py가 읽는 파일)
# 시간 단위는 초. clips의 start는 원본 영상에서 시작할 위치.
# cards의 at은 장면 안에서 카드가 나오는 시각, add는 누적 금액 카운터에 더할 금액.

title: 헬스인의 하루 식비 1만원
protein_goal: 144

scenes:
